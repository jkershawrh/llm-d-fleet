{{- if .Values.controller.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fleet-llm-d.fullname" . }}-controller
  labels:
    {{- include "fleet-llm-d.labels" . | nindent 4 }}
    app.kubernetes.io/name: fleet-controller
    app.kubernetes.io/component: controller
spec:
  replicas: {{ .Values.controller.replicaCount }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: fleet-controller
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        {{- toYaml .Values.controller.podAnnotations | nindent 8 }}
      labels:
        app.kubernetes.io/name: fleet-controller
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: controller
        app.kubernetes.io/part-of: fleet-llm-d
        {{- with .Values.controller.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ default (printf "%s-controller" (include "fleet-llm-d.fullname" .)) .Values.controller.serviceAccount.name }}
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: fleet-controller
          image: "{{ .Values.controller.image.repository }}:{{ default .Chart.AppVersion .Values.controller.image.tag }}"
          imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          args:
            - --identity-provider={{ ternary .Values.auth.provider "disabled" .Values.auth.enabled }}
            - --port={{ .Values.controller.ports.api }}
            - --metrics-port={{ .Values.controller.ports.metrics }}
            - --mode={{ .Values.controller.mode }}
            - --routing-provider={{ .Values.controller.routingProvider }}
            - --allow-operator-json-intents={{ .Values.controller.allowOperatorJSONIntents }}
            - --ledger-mode={{ .Values.externalDependencies.ledger.mode }}
            - --kube-api=https://kubernetes.default.svc
            - --namespace={{ .Release.Namespace }}
            - --rate-limit={{ .Values.controller.rateLimit.requestsPerSecond }}
            - --rate-burst={{ .Values.controller.rateLimit.burst }}
            - --max-inflight={{ .Values.controller.loadShedding.maxInflight }}
            {{- if .Values.tls.enabled }}
            - --tls-cert=/etc/fleet-tls/{{ .Values.tls.certKey }}
            - --tls-key=/etc/fleet-tls/{{ .Values.tls.keyKey }}
            {{- end }}
            {{- if .Values.controller.grpc.enabled }}
            - --grpc-port={{ .Values.controller.ports.grpc }}
            {{- end }}
            {{- if eq .Values.externalDependencies.ledger.mode "http" }}
            - --ledger-endpoint={{ required "externalDependencies.ledger.endpoint is required for http ledger mode" .Values.externalDependencies.ledger.endpoint }}
            {{- end }}
            {{- if .Values.externalDependencies.postgres.enabled }}
            - --pg-url=$(FLEET_POSTGRES_URL)
            {{- end }}
            {{- if .Values.externalDependencies.eventPublisher.enabled }}
            - --event-endpoint={{ required "externalDependencies.eventPublisher.endpoint is required when enabled" .Values.externalDependencies.eventPublisher.endpoint }}
            {{- end }}
            {{- if .Values.externalDependencies.modelPlane.enabled }}
            - --modelplane-api={{ required "externalDependencies.modelPlane.endpoint is required when enabled" .Values.externalDependencies.modelPlane.endpoint }}
            - --modelplane-namespace={{ .Values.externalDependencies.modelPlane.namespace }}
            {{- end }}
            {{- with .Values.controller.backends }}
            - --backends={{ . | toJson | quote }}
            {{- end }}
            {{- range .Values.controller.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- if .Values.auth.enabled }}
            {{- if eq .Values.auth.provider "hmac" }}
            - name: FLEET_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ required "auth.existingSecret is required when auth is enabled" .Values.auth.existingSecret }}
                  key: {{ .Values.auth.secretKey }}
                  optional: false
            {{- else if eq .Values.auth.provider "trusted-proxy" }}
            - name: FLEET_TRUSTED_IDENTITY_KEYS_JSON
              valueFrom:
                secretKeyRef:
                  name: {{ required "auth.trustedProxy.existingSecret is required for trusted-proxy" .Values.auth.trustedProxy.existingSecret }}
                  key: {{ .Values.auth.trustedProxy.keysKey }}
                  optional: false
            - name: FLEET_TRUSTED_IDENTITY_ISSUER
              value: {{ required "auth.trustedProxy.issuer is required for trusted-proxy" .Values.auth.trustedProxy.issuer | quote }}
            - name: FLEET_TRUSTED_IDENTITY_AUDIENCE
              value: {{ required "auth.trustedProxy.audience is required for trusted-proxy" .Values.auth.trustedProxy.audience | quote }}
            - name: FLEET_TRUSTED_IDENTITY_MAX_AGE
              value: {{ .Values.auth.trustedProxy.maxAge | quote }}
            - name: FLEET_TRUSTED_PROXY_REQUIRE_MTLS
              value: {{ .Values.auth.trustedProxy.requireMTLS | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.externalDependencies.gcl.enabled }}
            - name: GCL_DECISION_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "externalDependencies.gcl.existingSecret is required when GCL DecisionPackage admission is enabled" .Values.externalDependencies.gcl.existingSecret }}
                  key: {{ .Values.externalDependencies.gcl.secretKey }}
                  optional: false
            - name: GCL_DECISION_SIGNING_KEY_ID
              value: {{ .Values.externalDependencies.gcl.keyID | quote }}
            {{- end }}
            {{- if .Values.externalDependencies.postgres.enabled }}
            - name: FLEET_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "externalDependencies.postgres.existingSecret is required when PostgreSQL is enabled" .Values.externalDependencies.postgres.existingSecret }}
                  key: {{ .Values.externalDependencies.postgres.secretKey }}
                  optional: false
            {{- end }}
            {{- if and (eq .Values.externalDependencies.ledger.mode "http") (or .Values.externalDependencies.ledger.existingSecret (ne .Values.profile "standalone-dev")) }}
            - name: LEDGER_GATEWAY_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "externalDependencies.ledger.existingSecret is required for http ledger mode outside standalone-dev" .Values.externalDependencies.ledger.existingSecret }}
                  key: {{ .Values.externalDependencies.ledger.secretKey }}
                  optional: false
            {{- end }}
            {{- with .Values.externalDependencies.semanticClassifier.endpoint }}
            - name: SEMANTIC_CLASSIFIER_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.externalDependencies.platformMetrics.gclURL }}
            - name: GCL_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.externalDependencies.platformMetrics.deepfieldURL }}
            - name: DEEPFIELD_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.externalDependencies.platformMetrics.ledgerGatewayURL }}
            - name: LEDGER_GATEWAY_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.controller.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if eq .Values.controller.routingProvider "llm-d-router" }}
            - name: LLMD_ROUTER_ENDPOINTS_DIR
              value: {{ .Values.controller.llmdRouter.endpointsDirectory | quote }}
            - name: LLMD_ROUTER_ALLOW_INSECURE
              value: {{ .Values.controller.llmdRouter.allowInsecure | quote }}
            {{- end }}
          ports:
            - name: api
              containerPort: {{ .Values.controller.ports.api }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.controller.ports.metrics }}
              protocol: TCP
            {{- if .Values.controller.grpc.enabled }}
            - name: grpc
              containerPort: {{ .Values.controller.ports.grpc }}
              protocol: TCP
            {{- end }}
          startupProbe:
            httpGet:
              path: /healthz
              port: api
              {{- if .Values.tls.enabled }}
              scheme: HTTPS
              {{- end }}
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: api
              {{- if .Values.tls.enabled }}
              scheme: HTTPS
              {{- end }}
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: api
              {{- if .Values.tls.enabled }}
              scheme: HTTPS
              {{- end }}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          {{- if or .Values.tls.enabled (eq .Values.controller.routingProvider "llm-d-router") }}
          volumeMounts:
            {{- if .Values.tls.enabled }}
            - name: fleet-tls
              mountPath: /etc/fleet-tls
              readOnly: true
            {{- end }}
            {{- if eq .Values.controller.routingProvider "llm-d-router" }}
            - name: llmd-router-endpoints
              mountPath: {{ .Values.controller.llmdRouter.endpointsDirectory }}
            {{- end }}
          {{- end }}
      {{- if or .Values.tls.enabled (eq .Values.controller.routingProvider "llm-d-router") }}
      volumes:
        {{- if .Values.tls.enabled }}
        - name: fleet-tls
          secret:
            secretName: {{ required "tls.existingSecret is required when TLS is enabled" .Values.tls.existingSecret }}
            items:
              - key: {{ .Values.tls.certKey }}
                path: {{ .Values.tls.certKey }}
              - key: {{ .Values.tls.keyKey }}
                path: {{ .Values.tls.keyKey }}
        {{- end }}
        {{- if eq .Values.controller.routingProvider "llm-d-router" }}
        - name: llmd-router-endpoints
          emptyDir: {}
        {{- end }}
      {{- end }}
      {{- with .Values.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
