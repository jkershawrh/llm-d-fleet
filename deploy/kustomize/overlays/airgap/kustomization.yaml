apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fleet-llm-d

resources:
  - ../standalone

# Air-gap image overrides: replace all external registry references with the
# local mirror. Set MIRROR_REGISTRY to your disconnected registry before
# running `kustomize build`.
#
# Default mirror: registry.local:5000/fleet-llm-d
images:
  - name: ghcr.io/jkershawrh/llm-d-fleet/fleet-controller
    newName: registry.local:5000/fleet-llm-d/fleet-controller
    newTag: "0.3.0"
  - name: ghcr.io/jkershawrh/llm-d-fleet/fleet-agent
    newName: registry.local:5000/fleet-llm-d/fleet-agent
    newTag: "0.3.0"
  - name: postgres
    newName: registry.local:5000/fleet-llm-d/postgres
    newTag: "16"
  - name: redis
    newName: registry.local:5000/fleet-llm-d/redis
    newTag: "7-alpine"
  - name: registry.redhat.io/rhel9/postgresql-16
    newName: registry.local:5000/fleet-llm-d/postgresql-16
    newTag: "latest"
  - name: vllm/vllm-openai
    newName: registry.local:5000/fleet-llm-d/vllm-openai
    newTag: "latest"
